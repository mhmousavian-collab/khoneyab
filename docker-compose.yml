services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: sqlite:////app/data/khoneyab.db
      CORS_ORIGINS: http://localhost:8081,http://127.0.0.1:8081,http://localhost:5173,http://127.0.0.1:5173
      AI_CHEAP_BASE_URL: ${AI_CHEAP_BASE_URL:-}
      AI_CHEAP_MODEL: ${AI_CHEAP_MODEL:-}
      AI_CHEAP_API_KEY: ${AI_CHEAP_API_KEY:-}
      AI_STANDARD_BASE_URL: ${AI_STANDARD_BASE_URL:-}
      AI_STANDARD_MODEL: ${AI_STANDARD_MODEL:-}
      AI_STANDARD_API_KEY: ${AI_STANDARD_API_KEY:-}
      AI_PREMIUM_BASE_URL: ${AI_PREMIUM_BASE_URL:-}
      AI_PREMIUM_MODEL: ${AI_PREMIUM_MODEL:-}
      AI_PREMIUM_API_KEY: ${AI_PREMIUM_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - khoneyab_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  khoneyab_data:
